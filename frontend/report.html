<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Card — InsuranceGrokBot Training</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .report-header {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        .grade-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 2.5rem;
            flex-shrink: 0;
        }
        .grade-circle .score {
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0.85;
        }
        .grade-A { background: rgba(16,185,129,0.15); color: var(--accent-green); border: 2px solid var(--accent-green); }
        .grade-B { background: rgba(6,182,212,0.15); color: var(--accent-cyan); border: 2px solid var(--accent-cyan); }
        .grade-C { background: rgba(245,158,11,0.15); color: var(--accent-amber); border: 2px solid var(--accent-amber); }
        .grade-D { background: rgba(239,68,68,0.15); color: var(--accent-red); border: 2px solid var(--accent-red); }
        .grade-F { background: rgba(239,68,68,0.15); color: var(--accent-red); border: 2px solid var(--accent-red); }
        .report-meta { flex: 1; }
        .report-meta h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .report-meta .meta-row {
            display: flex;
            gap: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            flex-wrap: wrap;
        }
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .cat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
        }
        .cat-card h4 {
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cat-card .cat-score {
            font-weight: 800;
            font-size: 1.1rem;
        }
        .cat-card .bar-track {
            height: 8px;
            background: var(--bg-input);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.75rem;
        }
        .cat-card .bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.6s ease;
        }
        .cat-card .feedback { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.5; }
        .deal-killers-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .deal-killers-section h3 { margin-bottom: 1rem; }
        .dk-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }
        .dk-item {
            padding: 1rem;
            border-radius: var(--radius-sm);
            background: var(--bg-primary);
        }
        .dk-item h5 { font-size: 0.9rem; margin-bottom: 0.25rem; }
        .dk-item p { font-size: 0.8rem; color: var(--text-muted); }
        .style-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .style-section h3 { margin-bottom: 0.5rem; }
        .style-badge {
            display: inline-block;
            padding: 0.35rem 1rem;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 0.9rem;
            background: rgba(79,70,229,0.15);
            color: var(--accent-blue);
            margin-bottom: 1rem;
        }
        .pros-cons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .pros-cons h5 { font-size: 0.85rem; margin-bottom: 0.5rem; color: var(--text-muted); }
        .pros-cons ul { list-style: none; padding: 0; }
        .pros-cons li {
            font-size: 0.85rem;
            padding: 0.35rem 0;
            color: var(--text-secondary);
        }
        .pros li::before { content: '+ '; color: var(--accent-green); font-weight: 700; }
        .cons li::before { content: '- '; color: var(--accent-red); font-weight: 700; }
        .transcript-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
        }
        .transcript-section h3 { margin-bottom: 1rem; }
        .transcript-line {
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
        }
        .transcript-line:last-child { border-bottom: none; }
        .transcript-line .role {
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            margin-bottom: 0.15rem;
        }
        .transcript-line .role.agent { color: var(--accent-blue); }
        .transcript-line .role.client { color: var(--accent-cyan); }
    </style>
</head>
<body>

        </nav>

    <main class="main-content">
        <a href="/report-cards" style="color:var(--text-muted);font-size:0.85rem;text-decoration:none;display:inline-block;margin-bottom:1rem;">&larr; Back to Report Cards</a>

        <div id="reportContent">
            <div style="text-align:center;padding:3rem;color:var(--text-muted);">
                <div class="spinner"></div>
                <p style="margin-top:1rem;">Loading report card...</p>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script>
        if (!requireAuth()) {}

        const params = new URLSearchParams(window.location.search);
        const reportId = params.get('id');
        const sessionId = params.get('session');

        async function loadReport() {
            if (!reportId && !sessionId) {
                document.getElementById('reportContent').innerHTML =
                    '<p style="color:var(--accent-red);">No report ID specified.</p>';
                return;
            }

            try {
                let report;
                if (reportId) {
                    report = await API.getReportCard(reportId);
                } else {
                    report = await API.getReportCardBySession(sessionId);
                }
                renderReport(report);
            } catch (err) {
                document.getElementById('reportContent').innerHTML =
                    `<p style="color:var(--accent-red);">Failed to load report: ${err.message}</p>`;
            }
        }

        function barColor(score) {
            if (score >= 80) return 'var(--accent-green)';
            if (score >= 60) return 'var(--accent-cyan)';
            if (score >= 40) return 'var(--accent-amber)';
            return 'var(--accent-red)';
        }

        function renderReport(data) {
            const report = typeof data.full_report === 'string' ? JSON.parse(data.full_report) : (data.full_report || data);
            const rawCategories = typeof data.categories === 'string' ? JSON.parse(data.categories) : (data.categories || report.categories || {});
            const dealKillers = typeof data.deal_killers === 'string' ? JSON.parse(data.deal_killers) : (data.deal_killers || report.deal_killers || {});
            const clientInfo = typeof data.client_info === 'string' ? JSON.parse(data.client_info) : (data.client_info || report.persona || {});

            // Normalize categories: engine produces a dict {"tonality": {"metric": "Tonality", "score": 80, ...}}
            // Convert to array for rendering
            let categories = [];
            if (Array.isArray(rawCategories)) {
                categories = rawCategories;
            } else if (typeof rawCategories === 'object' && rawCategories !== null) {
                categories = Object.entries(rawCategories).map(([key, val]) => ({
                    name: (val && val.metric) || key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()),
                    score: (val && val.score) || 0,
                    grade: (val && val.grade) || '',
                    feedback: (val && val.feedback) || '',
                    coaching: (val && val.coaching) || '',
                    pros: (val && val.pros) || [],
                    consequences: (val && val.consequences) || [],
                }));
            }

            // Grade: grading engine uses "overall_grade", DB stores as "letter_grade"
            const grade = data.letter_grade || report.overall_grade || report.letter_grade || 'N/A';
            const score = data.overall_score || report.overall_score || 0;
            // Style: grading engine uses sales_style.detected / sales_style.name
            const salesStyle = report.sales_style || {};
            const style = data.detected_style || salesStyle.name || salesStyle.detected || report.detected_sales_style || 'Unknown';
            const closeProb = data.close_probability || report.close_probability || 0;
            const duration = data.duration_seconds || 0;

            const gradeClass = grade.startsWith('A') ? 'grade-A' :
                               grade.startsWith('B') ? 'grade-B' :
                               grade.startsWith('C') ? 'grade-C' :
                               grade.startsWith('D') ? 'grade-D' : 'grade-F';

            let html = `
                <div class="report-header">
                    <div class="grade-circle ${gradeClass}">
                        ${grade}
                        <span class="score">${Math.round(score)}%</span>
                    </div>
                    <div class="report-meta">
                        <h1>Training Report Card</h1>
                        <div class="meta-row">
                            <span>Client: ${clientInfo.first_name || clientInfo.name || 'Unknown'}${clientInfo.age ? ', ' + clientInfo.age + 'yo' : ''}</span>
                            <span>State: ${clientInfo.state || 'N/A'}</span>
                            <span>Duration: ${formatDuration(duration)}</span>
                            <span>Close Probability: ${Math.round(closeProb)}%</span>
                            <span>Date: ${data.created_at ? formatDate(data.created_at) : 'N/A'}</span>
                        </div>
                    </div>
                </div>
            `;

            // Style section — grading engine uses "sales_style" with pros/consequences/coaching
            html += `
                <div class="style-section">
                    <h3>Detected Sales Style</h3>
                    <div class="style-badge">${style}</div>
                    ${salesStyle.description ? `<p style="font-size:0.9rem;color:var(--text-secondary);margin-bottom:1rem;">${salesStyle.description}</p>` : ''}
                    <div class="pros-cons">
                        <div class="pros">
                            <h5>Strengths</h5>
                            <ul>
                                ${(salesStyle.pros || []).map(p => `<li>${p}</li>`).join('') || '<li>No data</li>'}
                            </ul>
                        </div>
                        <div class="cons">
                            <h5>Consequences</h5>
                            <ul>
                                ${(salesStyle.consequences || []).map(c => `<li>${c}</li>`).join('') || '<li>No data</li>'}
                            </ul>
                        </div>
                    </div>
                    ${salesStyle.coaching ? `<p style="font-size:0.85rem;color:var(--text-muted);margin-top:1rem;font-style:italic;">${salesStyle.coaching}</p>` : ''}
                </div>
            `;

            // Category grid
            html += '<h3 style="margin-bottom:1rem;">Performance by Category</h3><div class="category-grid">';
            for (const cat of categories) {
                const catScore = cat.score || 0;
                const color = barColor(catScore);
                html += `
                    <div class="cat-card">
                        <h4>
                            ${cat.name || 'Unknown'}
                            <span class="cat-score" style="color:${color}">${Math.round(catScore)}</span>
                        </h4>
                        <div class="bar-track">
                            <div class="bar-fill" style="width:${catScore}%;background:${color};"></div>
                        </div>
                        <div class="feedback">${cat.feedback || ''}</div>
                    </div>
                `;
            }
            html += '</div>';

            // Deal killers — grading engine returns {money: {...}, time: {...}, decision_maker: {...}}
            // Each has sub-fields like raised, resolved, coaching, etc.
            const dkKeys = Object.keys(dealKillers).filter(k =>
                typeof dealKillers[k] === 'object' && dealKillers[k] !== null
            );
            if (dkKeys.length > 0) {
                html += `
                    <div class="deal-killers-section">
                        <h3>Deal Killers &amp; Objections</h3>
                        <div class="dk-grid">
                            ${dkKeys.map(key => {
                                const dk = dealKillers[key];
                                const label = key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                                const raised = dk.raised || dk.objection_raised;
                                const resolved = dk.resolved || dk.objection_resolved;
                                const status = raised
                                    ? (resolved ? 'Raised & Resolved' : 'Raised — NOT Resolved')
                                    : 'Not raised';
                                const statusColor = !raised ? 'var(--text-muted)' :
                                    resolved ? 'var(--accent-green)' : 'var(--accent-red)';
                                return `
                                    <div class="dk-item">
                                        <h5>${label}</h5>
                                        <p style="color:${statusColor};font-weight:600;">${status}</p>
                                        ${dk.coaching ? `<p style="font-size:0.78rem;margin-top:0.5rem;">${dk.coaching}</p>` : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }

            // Strengths & Areas for Improvement from grading engine
            const strengths = report.top_strengths || [];
            const improvements = report.areas_for_improvement || [];
            if (strengths.length > 0 || improvements.length > 0) {
                html += `<div class="style-section"><h3>Coaching Summary</h3><div class="pros-cons">`;
                if (strengths.length > 0) {
                    html += `<div class="pros"><h5>Top Strengths</h5><ul>
                        ${strengths.map(s => `<li>${s.category.replace(/_/g, ' ')} (${Math.round(s.score)})</li>`).join('')}
                    </ul></div>`;
                }
                if (improvements.length > 0) {
                    html += `<div class="cons"><h5>Areas for Improvement</h5><ul>
                        ${improvements.map(s => `<li>${s.category.replace(/_/g, ' ')} (${Math.round(s.score)})${s.coaching ? ' — ' + s.coaching : ''}</li>`).join('')}
                    </ul></div>`;
                }
                html += `</div></div>`;
            }

            document.getElementById('reportContent').innerHTML = html;
        }

        loadReport();
    </script>
</body>
</html>
