        </div>
    </aside>

    <main class="main-content">
        <h1 class="mb-3">Report Cards</h1>
        <div id="reportList">
            <div class="empty-state">
                <h3>No report cards yet</h3>
                <p>Complete a training session to see your report cards here.</p>
                <a href="/training" class="btn btn-primary mt-2">Start Training</a>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/mobile-nav.js"></script>
    <script>
        initMobileNav('report-cards');
        if (!requireAuth()) {}

        async function loadReports() {
            try {
                const reports = await API.getReportCards();
                const container = document.getElementById('reportList');
                if (!reports || !reports.length) return;

                container.innerHTML = reports.map(r => {
                    const info = typeof r.client_info === 'string' ? JSON.parse(r.client_info) : (r.client_info || {});
                    const fullReport = typeof r.full_report === 'string' ? JSON.parse(r.full_report) : (r.full_report || {});
                    return `
                        <div class="card" style="margin-bottom:0.75rem;cursor:pointer;display:flex;align-items:center;gap:1rem;" onclick="window.location.href='/report?id=${r.id}'">
                            <div class="grade ${gradeClass(r.letter_grade || 'F')}" style="font-size:2rem;width:60px;text-align:center;">${r.letter_grade || 'F'}</div>
                            <div style="flex:1;">
                                <h4 style="font-size:0.95rem;">Session with ${info.first_name || 'Client'}</h4>
                                <p style="font-size:0.8rem;color:var(--text-muted);">Score: ${(r.overall_score || 0).toFixed(1)} | Style: ${r.detected_style || 'Unknown'} | Close: ${((r.close_probability || 0)).toFixed(0)}%</p>
                            </div>
                            <div style="text-align:right;font-size:0.8rem;color:var(--text-muted);">
                                ${formatDate(r.created_at)}<br>
                                ${formatDuration(r.duration_seconds || 0)}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.error(err);
            }
        }

        loadReports();
    </script>
</body>
</html>
